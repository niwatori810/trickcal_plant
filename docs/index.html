<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>誠意作成中</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px 20px;
    background: #f4eefb;
    color: #4a3b52;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic", "Meiryo", sans-serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  img {
    width: min(360px, 80vw);
    height: auto;
    border-radius: 20px;
    box-shadow: 0 10px 28px rgba(122, 90, 150, 0.22);
  }

  p {
    margin: 0;
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 700;
    line-height: 1.6;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <img src="rim.png" alt="リム">
  <p>誠意作成中<br>遅れてごめんね！</p>
</body>
</html>
